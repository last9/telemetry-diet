name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm run verify
      - run: npm run release:check -- --tag "${GITHUB_REF_NAME}"
      - name: Build release tarball
        run: npm pack
      - name: Generate production dependency SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > "telemetry-diet-${GITHUB_REF_NAME}.cdx.json"
      - name: Publish exact tarball to npm
        run: npm publish telemetry-diet-*.tgz --access public --provenance
      - name: Create GitHub release with package and SBOM
        run: gh release create "${GITHUB_REF_NAME}" telemetry-diet-*.tgz telemetry-diet-*.cdx.json --verify-tag --generate-notes --title "Telemetry Diet ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
